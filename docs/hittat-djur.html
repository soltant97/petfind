<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hittat djur – DjurHittaren</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
<style>body{background:#F6EDE0;display:flex;justify-content:center}</style></head><body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF5;font-family:'Nunito',system-ui,sans-serif;color:#3A2A1E;display:flex;flex-direction:column;overflow:hidden">

<div style="padding:16px 20px 0 20px;display:flex;align-items:center;gap:12px">
<a href="index.html" aria-label="Tillbaka" style="width:44px;height:44px;border-radius:50%;background:#F6EDE0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A2A1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div>
<h1 style="margin:0;font-size:24px;font-weight:800">Jag har hittat ett djur</h1>
<div style="font-size:14px;color:#7A6552;font-weight:600">Inget konto behövs för att söka</div>
</div>
</div>

<div style="padding:16px 20px 0 20px;display:flex;flex-direction:column;gap:16px;flex:1">

<div>
<div style="font-size:15px;font-weight:800;margin-bottom:8px">1. Foton</div>
<div style="display:flex;gap:10px">
<button style="width:104px;height:104px;border-radius:18px;border:2px dashed #E5B84A;background:#FFF3C9;font-family:inherit;color:#3A2A1E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3A2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Ta foto</button>
<div style="width:104px;height:104px;border-radius:18px;background:#F6EDE0;position:relative;display:flex;align-items:center;justify-content:center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3A2A1E" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="10" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14" cy="5.5" r="2"/><circle cx="18" cy="10" r="2"/><path d="M12 12c-3 0-5.5 3-5.5 5.2 0 1.7 1.4 2.3 2.8 2.3 1 0 1.8-.4 2.7-.4s1.7.4 2.7.4c1.4 0 2.8-.6 2.8-2.3C17.5 15 15 12 12 12z"/></svg>
<button aria-label="Ta bort bild" style="position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;border:2px solid #FFFCF5;background:#F4806B;color:#3A2A1E;font-weight:800;font-size:16px;line-height:1;padding:0">×</button>
</div>
<button style="width:104px;height:104px;border-radius:18px;border:1.5px solid #E9DCC8;background:#FFFFFF;font-family:inherit;color:#3A2A1E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3A2A1E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Välj bilder</button>
</div>
</div>

<div>
<div style="font-size:15px;font-weight:800;margin-bottom:8px">2. Djurslag</div>
<div style="display:flex;gap:8px">
<button style="min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#FFD770;color:#3A2A1E;font-family:inherit;font-weight:800;font-size:15px">Katt</button>
<button style="min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #E9DCC8;background:#FFFFFF;color:#3A2A1E;font-family:inherit;font-weight:700;font-size:15px">Hund</button>
<button style="min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #E9DCC8;background:#FFFFFF;color:#3A2A1E;font-family:inherit;font-weight:700;font-size:15px">Annat</button>
</div>
</div>

<div>
<div style="font-size:15px;font-weight:800;margin-bottom:8px">3. Var hittade du djuret?</div>
<input aria-label="Område eller ort" placeholder="Område eller ort, till exempel Södermalm" style="width:100%;box-sizing:border-box;height:50px;border:1.5px solid #E9DCC8;background:#FFFFFF;border-radius:16px;padding:0 14px;font-family:inherit;font-size:16px;color:#3A2A1E">
<button style="margin-top:8px;min-height:44px;padding:0 16px;border-radius:14px;border:1.5px solid #E9DCC8;background:#FFE3DC;color:#3A2A1E;font-family:inherit;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8402D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Använd min position</button>
<div style="font-size:13px;color:#7A6552;font-weight:600;margin-top:6px">Positionen används bara för att föreslå ort och sparas inte. Tid och datum sätts till nu.</div>
</div>

<div>
<label for="desc" style="display:block;font-size:15px;font-weight:800;margin-bottom:8px">4. Hur ser djuret ut?</label>
<textarea id="desc" rows="3" placeholder="Färg, tecken, halsband, ögonfärg …" style="width:100%;box-sizing:border-box;border:1.5px solid #E9DCC8;background:#FFFFFF;border-radius:16px;padding:12px 14px;font-family:inherit;font-size:16px;color:#3A2A1E;resize:none;line-height:1.4"></textarea>
</div>
</div>

<div style="padding:12px 20px 24px 20px;background:#FFFFFF;border-top:1px solid #EFE3D0">
<a href="resultat.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:#FFD770;font-weight:800;font-size:17px;color:#3A2A1E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A2A1E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
Sök efter ägaren</a>
</div>
</div>
</body></html>
